# ================================================================
# MrMarket 全栈容器化部署
#
# 启动全部服务（需要先构建镜像）：
#   docker compose -f docker/docker-compose.yml up -d
#
# 仅启动数据库（本地跑前后端）：
#   docker compose -f docker/docker-compose.yml up -d postgres redis
# ================================================================

services:
  # ---------- PostgreSQL 16 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: mrmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mrmarket
      POSTGRES_PASSWORD: mrmarket
      POSTGRES_DB: mrmarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrmarket"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- Redis 7 缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: mrmarket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- 后端 API ----------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: mrmarket-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://mrmarket:mrmarket@postgres:5432/mrmarket
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 开发模式下可注释掉 api 服务，用本地 uvicorn --reload

  # ---------- 前端 ----------
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    container_name: mrmarket-ui
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
